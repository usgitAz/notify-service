# Base compose file — shared infrastructure for ALL environments.
# Do NOT use this file directly; always combine it with a dev/prod override:
#
#   Dev:   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: notify-service

services:
  db:
    image: postgres:17-alpine
    container_name: notify-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: notify-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
