[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notify-service"
version = "0.1.0"
description = "Notification as a Service (NaaS) - MVP"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Alireza sohrabi", email = "gmdevaz@gmail.com" }]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "aiosmtplib>=5.1.2",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[project.urls]
Repository = "https://github.com/usgitAz/notify-service"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Ruff Configuration
[tool.ruff]
target-version = "py313"
line-length = 88
fix = true
show-fixes = true

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic/versions",
    ".ruff_cache",
    ".mypy_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "A",   # flake8-builtins
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"__init__.py" = ["F401"]
"app/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"




[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

exclude = ["alembic/versions/", "tests/"]
disable_error_code = ["prop-decorator"]
