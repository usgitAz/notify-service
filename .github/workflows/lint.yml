# Lint workflow — runs Ruff check & format on every push/PR to main.
# Complements pre-commit hooks as a final safety net.
name: Lint

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ruff:
        name: Ruff
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up uv
              uses: astral-sh/setup-uv@v5
              with:
                  version: "0.12.17"
                  enable-cache: true

            - name: Install Python
              run: uv python install 3.13

            - name: Install dependencies
              run: uv sync --frozen --group dev

            - name: Ruff check
              run: uv run ruff check .

            - name: Ruff format
              run: uv run ruff format --check .
