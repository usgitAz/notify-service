# Tests workflow — full suite (unit + integration) with coverage
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_VERSION: "0.12.17"
  POSTGRES_USER: user
  POSTGRES_PASSWORD: pass
  POSTGRES_DB: notif_test
  API_KEY_PEPPER: "test-pepper-with-at-least-48-characters-for-ci-only-xyz"
  TEST_DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5433/notif_test

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: notif_test
        # 5433 matches tests/conftest.py (avoids clash with local dev DB on 5432)
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U user -d notif_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run all tests with coverage
        run: |
          uv run pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
